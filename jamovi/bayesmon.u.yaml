title: Bayesian Sequential Monitoring
name: bayesmon
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: model
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Cumulative N
        children:
          - type: VariablesListBox
            name: lookN
            maxItemCount: 1
            isTarget: true
            enable: (model:normal)
      - type: TargetLayoutBox
        label: Estimate
        children:
          - type: VariablesListBox
            name: estimate
            maxItemCount: 1
            isTarget: true
            enable: (model:normal)
      - type: TargetLayoutBox
        label: Standard error
        children:
          - type: VariablesListBox
            name: se
            maxItemCount: 1
            isTarget: true
            enable: (model:normal)
      - type: TargetLayoutBox
        label: Control responses
        children:
          - type: VariablesListBox
            name: xC
            maxItemCount: 1
            isTarget: true
            enable: (model:binary)
      - type: TargetLayoutBox
        label: Control patients
        children:
          - type: VariablesListBox
            name: nC
            maxItemCount: 1
            isTarget: true
            enable: (model:binary)
      - type: TargetLayoutBox
        label: Treatment responses
        children:
          - type: VariablesListBox
            name: xT
            maxItemCount: 1
            isTarget: true
            enable: (model:binary)
      - type: TargetLayoutBox
        label: Treatment patients
        children:
          - type: VariablesListBox
            name: nT
            maxItemCount: 1
            isTarget: true
            enable: (model:binary)
      - type: TargetLayoutBox
        label: Outcome (rows in arrival order)
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            enable: (model:bf)
      - type: TargetLayoutBox
        label: Group (two samples)
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
            enable: (model:bf && bfSamples:two)
  - type: CollapseBox
    label: Design
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Looks
                children:
                  - type: TextBox
                    name: nLooks
                    format: number
                    enable: (model:normal || model:binary)
                  - type: TextBox
                    name: timing
                    format: string
                    enable: (model:normal || model:binary)
              - type: Label
                label: Normal approximation
                children:
                  - type: ComboBox
                    name: arms
                    enable: (model:normal)
                  - type: TextBox
                    name: nMax
                    format: number
                    enable: (model:normal)
                  - type: TextBox
                    name: sigma
                    format: number
                    enable: (model:normal)
                  - type: TextBox
                    name: theta1
                    format: number
                    enable: (model:normal)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Two arms, binary
                children:
                  - type: TextBox
                    name: pC
                    format: number
                    enable: (model:binary)
                  - type: TextBox
                    name: pT
                    format: number
                    enable: (model:binary)
                  - type: TextBox
                    name: bNMax
                    format: number
                    enable: (model:binary)
  - type: CollapseBox
    label: Prior and decision rules
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: prior
                enable: (model:normal)
              - type: TextBox
                name: priorMean
                format: number
                enable: (model:normal && prior:custom)
              - type: TextBox
                name: priorSD
                format: number
                enable: (model:normal && prior:custom)
              - type: TextBox
                name: priorA
                format: number
                enable: (model:binary)
              - type: TextBox
                name: priorB
                format: number
                enable: (model:binary)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: delta
                format: number
                enable: (model:normal || model:binary)
              - type: TextBox
                name: gammaE
                format: number
                enable: (model:normal || model:binary)
              - type: CheckBox
                name: effInterim
                enable: (model:normal || model:binary)
              - type: CheckBox
                name: futility
                enable: (model:normal || model:binary)
                children:
                  - type: TextBox
                    name: gammaF
                    format: number
                    enable: (futility && (model:normal || model:binary))
  - type: CollapseBox
    label: Bayes factor
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: bfSamples
                enable: (model:bf)
              - type: TextBox
                name: mu0
                format: number
                enable: (model:bf && bfSamples:one)
              - type: TextBox
                name: rScale
                format: number
                enable: (model:bf)
              - type: TextBox
                name: bfK
                format: number
                enable: (model:bf)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: bfNMin
                format: number
                enable: (model:bf)
              - type: TextBox
                name: bfNMax
                format: number
                enable: (model:bf)
              - type: TextBox
                name: d1
                format: number
                enable: (model:bf)
              - type: TextBox
                name: nsim
                format: number
                enable: (model:bf)
              - type: TextBox
                name: seed
                format: number
                enable: (model:bf)
  - type: CollapseBox
    label: Output
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: level
                format: number
              - type: CheckBox
                name: ocTable
              - type: CheckBox
                name: ocPlot
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boundPlot
              - type: CheckBox
                name: probPlot
              - type: CheckBox
                name: densityPlot
