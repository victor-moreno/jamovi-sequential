---
title: Sequential Designs
name: jmsequential
version: 0.5.10
jms: '1.0'
authors:
  - V. Moreno
maintainer: V. Moreno <v.moreno@iconcologia.net>
date: '2026-09-27'
type: R
description: >-
  Design and monitoring of studies analysed repeatedly as data accumulate, with
  control of type I and type II errors: group sequential boundaries (classical
  and error spending, with futility), Whitehead's triangular tests, sample size
  for means, proportions and survival (accrual, follow-up, dropout), phase II
  multistage designs (Simon, Fleming, Bayesian predictive and posterior),
  sequential probability ratio tests (Wald, sequential t-tests), the MaxSPRT for
  safety surveillance, Bayesian monitoring with frequentist operating
  characteristics, and anytime-valid e-values and confidence sequences.
analyses:
  - title: Group Sequential Design
    name: gsd
    ns: jmsequential
    menuGroup: Sequential
    menuTitle: Group Sequential Design
    menuSubtitle: Boundaries, futility, sample size
    category: analyses
    description: >-
      Design of a group sequential study: efficacy boundaries (classical,
      error-spending or Whitehead's triangular test), optional futility
      boundaries, operating characteristics and the sample size or number of
      events, including survival designs with accrual, follow-up and dropout.
  - title: Phase II Multistage Design
    name: phase2
    ns: jmsequential
    category: analyses
    menuGroup: Sequential
    menuTitle: Phase II Multistage Design
    menuSubtitle: Simon, Fleming, Bayesian monitoring
    description: >-
      Single-arm phase II designs for a binary response: Simon's optimal,
      minimax and admissible two-stage designs, the exact single-stage design,
      Fleming's multistage test, and Bayesian monitoring with predictive (Lee &
      Liu) or posterior probabilities. Exact operating characteristics, and
      inference for observed data.
  - title: Sequential Probability Ratio Test
    name: sprt
    ns: jmsequential
    category: analyses
    menuGroup: Sequential
    menuTitle: Sequential Probability Ratio Test
    menuSubtitle: Wald SPRT, sequential t-test, triangular test
    description: >-
      Wald's sequential probability ratio test after every observation, for a
      proportion, a mean or a difference in means with known SD, and the
      sequential one- and two-sample t-tests; optionally Whitehead's continuous
      triangular test, and truncation at a maximum sample size. Wald's
      approximations and exact (or simulated) operating characteristics, and the
      test applied to data in arrival order.
  - title: Safety Surveillance (MaxSPRT)
    name: maxsprt
    ns: jmsequential
    category: analyses
    menuGroup: Sequential
    menuTitle: Safety Surveillance (MaxSPRT)
    menuSubtitle: Poisson and binomial MaxSPRT
    description: >-
      Maximized sequential probability ratio test for post-marketing safety
      surveillance (Kulldorff et al. 2011): Poisson (observed against expected
      counts) or binomial (cases in the risk window against the control window),
      continuous or group monitoring, with an exact critical value, signalling
      thresholds, power, expected time to signal and expected length of
      surveillance, and the test applied to cumulative counts.
  - title: Bayesian Sequential Monitoring
    name: bayesmon
    ns: jmsequential
    category: analyses
    menuGroup: Sequential
    menuTitle: Bayesian Sequential Monitoring
    menuSubtitle: Posterior, predictive probability, Bayes factor
    description: >-
      Bayesian monitoring rules at interim analyses: stop for efficacy when the
      posterior probability of an effect beyond a threshold is high, and for
      futility when the predictive probability of final success is low; normal
      approximation (estimate and standard error per look) or two arms with a
      binary outcome (beta-binomial). Sequential Bayes factor t-tests (JZS) on
      raw data. Frequentist operating characteristics, exact or simulated.
  - title: Anytime-Valid Monitoring
    name: anytime
    ns: jmsequential
    category: analyses
    menuGroup: Sequential
    menuTitle: Anytime-Valid Monitoring
    menuSubtitle: E-values, confidence sequences
    description: >-
      Continuous monitoring with anytime-valid inference: Gaussian-mixture
      e-values (the mixture SPRT for a known SD, the safe t-test for an unknown
      SD), always-valid p-values and confidence sequences for a mean or a
      difference in means, valid at every sample size and under optional
      stopping. The design gives the sample size for a target power, exact for a
      known SD and simulated otherwise.
datasets:
  - name: Interim analyses - difference in means
    path: gsd_interim_means.csv
    description: >-
      Fabricated two-arm trial (difference in means, SD 1) at two interim looks.
      Group Sequential Design, defaults: stops for efficacy at look 2.
  - name: Interim analyses - survival
    path: gsd_interim_survival.csv
    description: >-
      Fabricated survival trial at two interim looks: events, log hazard ratio,
      SE. Group Sequential Design, time to event (hazard ratio 0.7).
  - name: Sequential outcomes - patients in arrival order
    path: sprt_sequential.csv
    description: >-
      Fabricated response, score and arm of 80 patients. SPRT: the default test
      accepts H1 after 30 patients; the two-sample t-test on score, after 41.
  - name: Safety surveillance - weekly counts
    path: maxsprt_surveillance.csv
    description: >-
      Fabricated weekly counts of an adverse event, and those expected under H0.
      Safety Surveillance (MaxSPRT), defaults: signal in week 12.
  - name: Interim analyses - two arms, binary outcome
    path: bayes_binary_interim.csv
    description: >-
      Fabricated responses per arm at two interim looks. Bayesian Sequential
      Monitoring, two arms binary (0.3 vs 0.5): stops for efficacy at look 2.
usesNative: false
minApp: 2.3.0

...
