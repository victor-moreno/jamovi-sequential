---
name:  sprt
title: Sequential Probability Ratio Test
jrs: '1.1'

items:
    - name: summary
      title: Design summary
      type: Table
      clearWith: [ model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule, nsim, seed ]
      columns:
        - name: name
          title: ''
          type: text
        - name: value
          title: Value
          type: text

    - name: oc
      title: Operating characteristics
      type: Table
      visible: (ocTable)
      clearWith: [ model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule, nsim, seed ]
      columns:
        - name: label
          title: ''
          type: text
        - name: theta
          title: True value
          type: number
        - name: pH1
          title: P(accept H1)
          superTitle: Exact
          type: number
        - name: asn
          title: Expected n
          superTitle: Exact
          type: number
        - name: waldPH1
          title: P(accept H1)
          superTitle: Wald approximation
          type: number
        - name: waldASN
          title: Expected n
          superTitle: Wald approximation
          type: number

    - name: test
      title: Sequential test
      type: Table
      visible: (dep)
      clearWith: [ dep, group, model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule ]
      columns:
        - name: N
          title: Observations
          type: integer
        - name: n
          title: n at decision
          type: integer
        - name: decision
          title: Decision
          type: text
        - name: stat
          title: LLR
          type: number
        - name: lower
          title: Lower
          superTitle: Thresholds
          type: number
        - name: upper
          title: Upper
          superTitle: Thresholds
          type: number
        - name: estimate
          title: Estimate
          type: number

    - name: path
      title: Path
      type: Table
      visible: (pathTable)
      clearWith: [ dep, group, model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule ]
      columns:
        - name: n
          title: n
          type: integer
        - name: V
          title: V
          type: number
          visible: (boundary:triangular)
        - name: stat
          title: LLR
          type: number
        - name: lower
          title: Lower
          type: number
        - name: upper
          title: Upper
          type: number

    - name: pathPlot
      title: Boundaries
      type: Image
      width: 550
      height: 420
      renderFun: .plotPath
      visible: (pathPlot)
      clearWith: [ dep, group, model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule ]

    - name: ocPlot
      title: Operating characteristics
      type: Image
      width: 550
      height: 500
      renderFun: .plotOC
      visible: (ocPlot)
      clearWith: [ model, p0, p1, mu0, mu1, delta1, sigma, d1, tails, alpha, power, boundary, truncate, nMax, truncRule, nsim, seed ]
...
